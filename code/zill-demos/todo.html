<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Todo - built by ZILL-Harness</title>
<style>
body{margin:0;min-height:100vh;background:#eef2f7;font-family:system-ui,sans-serif;display:grid;place-items:start center;padding:8vh 16px}
.box{width:100%;max-width:420px;background:#fff;border-radius:14px;padding:22px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
h2{margin:0 0 14px}form{display:flex;gap:8px}
input[type=text]{flex:1;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}
button{background:#3b6ef5;color:#fff;border:0;border-radius:8px;padding:0 16px;cursor:pointer}
ul{list-style:none;padding:0;margin:14px 0 0}li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eef0f4}
li.done span{text-decoration:line-through;color:#94a3b8}li span{flex:1}
li button{background:none;color:#e11d48;font-size:18px;padding:0 6px}
.f{margin-top:12px;font-size:12px;color:#94a3b8}
</style></head><body><div class="box">
<h2>Todo <small id="n" style="color:#94a3b8;font-weight:400"></small></h2>
<form id="f"><input type="text" id="t" placeholder="Add a task..." autofocus><button>Add</button></form>
<ul id="l"></ul><div class="f">Saved in your browser &middot; built by ZILL-Harness</div>
</div><script>
let todos=[];try{todos=JSON.parse(localStorage.getItem('zill-todos'))||[]}catch(e){}
const l=document.getElementById('l');
function save(){try{localStorage.setItem('zill-todos',JSON.stringify(todos))}catch(e){}render()}
function render(){
  l.innerHTML='';
  todos.forEach((t,i)=>{
    const li=document.createElement('li');if(t.d)li.className='done';
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=t.d;cb.onchange=()=>{t.d=cb.checked;save()};
    const sp=document.createElement('span');sp.textContent=t.text;
    const rm=document.createElement('button');rm.textContent='×';rm.onclick=()=>{todos.splice(i,1);save()};
    li.append(cb,sp,rm);l.append(li);});
  document.getElementById('n').textContent='('+todos.filter(t=>!t.d).length+' left)';}
document.getElementById('f').onsubmit=e=>{e.preventDefault();const i=document.getElementById('t');
  if(i.value.trim()){todos.push({text:i.value.trim(),d:false});i.value='';save();}};
render();
</script></body></html>
