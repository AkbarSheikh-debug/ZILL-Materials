<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake - built by ZILL-Harness</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10151c;color:#e8eef5;font-family:system-ui,sans-serif}
main{text-align:center}canvas{background:#18202b;border:2px solid #2c3a4d;border-radius:8px;display:block;margin:10px auto}
.tag{font-size:12px;color:#7d8da1}b{color:#5ee0a0}
</style></head><body><main>
<h2>Snake &mdash; score <b id="s">0</b></h2>
<canvas id="c" width="360" height="360"></canvas>
<div class="tag">Arrow keys / WASD &middot; Space to restart &middot; built by ZILL-Harness</div>
</main><script>
const c=document.getElementById('c'),x=c.getContext('2d'),N=18,S=20;
let snake,dir,next,food,score,over,timer;
function reset(){snake=[{x:9,y:9},{x:8,y:9},{x:7,y:9}];dir=next={x:1,y:0};score=0;over=false;place();
  document.getElementById('s').textContent=0;clearInterval(timer);timer=setInterval(tick,110);}
function place(){do{food={x:Math.random()*N|0,y:Math.random()*N|0}}while(snake.some(p=>p.x==food.x&&p.y==food.y));}
function tick(){
  dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x==h.x&&p.y==h.y)){over=true;clearInterval(timer);draw();return;}
  snake.unshift(h);
  if(h.x==food.x&&h.y==food.y){score++;document.getElementById('s').textContent=score;place();}else snake.pop();
  draw();}
function draw(){
  x.clearRect(0,0,360,360);
  x.fillStyle='#ff6b6b';x.fillRect(food.x*S+2,food.y*S+2,S-4,S-4);
  snake.forEach((p,i)=>{x.fillStyle=i?'#5ee0a0':'#b6ffd9';x.fillRect(p.x*S+1,p.y*S+1,S-2,S-2);});
  if(over){x.fillStyle='rgba(0,0,0,.65)';x.fillRect(0,0,360,360);x.fillStyle='#fff';x.font='24px system-ui';x.textAlign='center';
    x.fillText('Game over - Space to restart',180,180);}
}
const K={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
addEventListener('keydown',e=>{
  if(e.key==' '){reset();return;}
  const k=K[e.key];if(!k)return;e.preventDefault();
  if(k[0]!==-dir.x||k[1]!==-dir.y)next={x:k[0],y:k[1]};});
reset();draw();
</script></body></html>
