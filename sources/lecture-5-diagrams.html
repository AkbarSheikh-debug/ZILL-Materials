<!-- 06 -->
<svg class="d" data-t="Short-term and long-term memory" data-s="One lives in RAM for one session. The other lives on disk.">
  <rect x="120" y="250" width="780" height="540" rx="22" class="fam sam" stroke-width="4"/>
  <text x="510" y="320" class="bb c am">SHORT-TERM</text>

  <g class="sm c"><text x="510" y="470">lives in RAM</text><text x="510" y="520">user · assistant · tool results</text><text x="510" y="570">squeezed by compaction</text><text x="510" y="620">gone when the session ends</text></g>
  <text x="510" y="720" class="an c co">close the terminal, and it's gone</text>
  <rect x="1020" y="250" width="780" height="540" rx="22" class="fbl sbl" stroke-width="4"/>
  <text x="1410" y="320" class="bb c bl">LONG-TERM</text>
  <text x="1410" y="380" class="md c">files or a database on disk</text>
  <g class="sm c"><text x="1410" y="470">survives restarts</text><text x="1410" y="520">facts · preferences · skills</text><text x="1410" y="570">loaded again next session</text><text x="1410" y="620">grows for months</text></g>
  <text x="1410" y="720" class="an c bl">the hard part: deciding what to keep</text>
  <line x1="960" y1="260" x2="960" y2="780" class="ln da smu"/>
  <text x="960" y="900" class="b c">Every harness has short-term memory. Long-term memory is where they differ.</text>
</svg>

<script>
const NS='http://www.w3.org/2000/svg';
const qs=new URLSearchParams(location.search);
const only=qs.get('s');
const all=[...document.querySelectorAll('svg.d')];
all.forEach((svg,i)=>{
  const n=i+1, nn=String(n).padStart(2,'0');
  if(only && +only!==n){svg.remove();return;}
  svg.setAttribute('viewBox','0 0 1920 1080');
  svg.setAttribute('xmlns',NS);
  const head=`<defs>
    <marker id="a${n}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker>
    <marker id="b${n}" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0L0 5L10 10z" fill="context-stroke"/></marker>
    <filter id="wob${n}" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="2" seed="${n*7}" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <g id="man${n}" fill="none" stroke="#1e1e1e" stroke-width="4" stroke-linecap="round">
      <circle cx="50" cy="28" r="24" fill="#ffffff"/>
      <path d="M41 23v5M59 23v5M40 37q10 9 20 0"/>
      <path d="M50 52V125M50 78L12 108M50 78L90 100M50 125L22 196M50 125L80 196"/>
    </g>
    <g id="bot${n}" fill="none" stroke="#1e1e1e" stroke-width="4" stroke-linecap="round">
      <rect x="10" y="22" width="80" height="62" rx="12" fill="#ffffff"/>
      <circle cx="35" cy="50" r="8"/><circle cx="65" cy="50" r="8"/>
      <path d="M38 70h24M50 22V8"/><circle cx="50" cy="6" r="4"/>
    </g>
  </defs>
  <rect width="1920" height="1080" fill="#fffdf7"/>
  <g filter="url(#wob${n})">
  <text x="960" y="108" class="h c">${svg.dataset.t}</text>
  <path class="ul" d=""/>
  <text x="960" y="182" class="sub c">${svg.dataset.s}</text>
  <text x="70" y="1048" class="ft">ZILL HARNESS · Lecture 5 · Memory, sub-agents, durability</text>
  <text x="1850" y="1048" class="ft" text-anchor="end">${qs.get('n')||nn}</text>`;
  svg.innerHTML=head+svg.innerHTML.replaceAll('url(#a)',`url(#a${n})`).replaceAll('url(#b)',`url(#b${n})`).replaceAll('"#man"',`"#man${n}"`).replaceAll('"#bot"',`"#bot${n}"`)+'</g>';
  const L=Math.min(svg.querySelector('.h').getComputedTextLength(),1750);
  svg.querySelector('.ul').setAttribute('d',`M${960-L/2} 130 q${L/4} 12 ${L/2} 0 t${L/2} 0`);
});
if(only) document.body.classList.add('single');
if(qs.get('audit')){
  // Report text that leaves the sheet, spills out of the shape it sits in, or collides with other text.
  const out=[];
  document.querySelectorAll('svg.d').forEach((svg,i)=>{
    const n=svg.querySelector('.ft[text-anchor="end"]').textContent;
    const shapes=[...svg.querySelectorAll('rect')].filter(r=>+r.getAttribute('width')<1900).map(r=>r.getBBox());
    const boxes=[...svg.querySelectorAll('text')].filter(t=>t.textContent.trim()).map(t=>({t:t.textContent.trim(),b:t.getBBox()}));
    boxes.forEach(({t,b})=>{
      if(b.x<20||b.x+b.width>1900) out.push(`${n}: off sheet: "${t}"`);
      const cx=b.x+b.width/2, cy=b.y+b.height/2;
      const host=shapes.filter(r=>cx>r.x&&cx<r.x+r.width&&cy>r.y&&cy<r.y+r.height).sort((p,q)=>p.width*p.height-q.width*q.height)[0];
      if(host&&(b.x<host.x-2||b.x+b.width>host.x+host.width+2)) out.push(`${n}: spills its box: "${t}"`);
    });
    for(let p=0;p<boxes.length;p++)for(let q=p+1;q<boxes.length;q++){
      const A=boxes[p].b,B=boxes[q].b;
      const ox=Math.min(A.x+A.width,B.x+B.width)-Math.max(A.x,B.x), oy=Math.min(A.y+A.height,B.y+B.height)-Math.max(A.y,B.y);
      if(ox>4&&oy>6) out.push(`${n}: overlap: "${boxes[p].t}" / "${boxes[q].t}"`);
    }
  });
  const pre=document.createElement('pre');pre.id='report';pre.textContent=out.join('\n')||'clean';document.body.appendChild(pre);
}
</script>
