<svg class="d" data-t="fleet.py, the whole file" data-s="About thirty lines, and three details carry the design.">
  <rect x="60" y="235" width="1060" height="590" rx="20" class="box" stroke-width="4"/>
  <g class="mono" font-size="23">
  <text x="90" y="285">def run_fleet(jobs, make_harness, max_workers=4):</text>
  <text x="90" y="325">    with ThreadPoolExecutor(max_workers) as pool:</text>
  <text x="90" y="365">        futures = [pool.submit(_run_one, j, ...)]</text>
  <text x="90" y="405">        for f in as_completed(futures):</text>
  <text x="90" y="445">            results.append(f.result())</text>
  <text x="90" y="485">    return sorted(results, key=input_order)</text>
  <text x="90" y="565">def _run_one(job, make_harness):</text>
  <text x="90" y="605">    try:</text>
  <text x="90" y="645">        h = make_harness(job["workdir"])</text>
  <text x="90" y="685">        return {"ok": True, "report": h.run(job["task"])}</text>
  <text x="90" y="725">    except Exception as e:</text>
  <text x="90" y="765">        return {"ok": False, "report": str(e)}</text></g>
  <g class="bb"><text x="1070" y="485" class="am">3</text><text x="1070" y="645" class="te">1</text><text x="1070" y="765" class="co">2</text></g>
  <rect x="1180" y="260" width="680" height="150" rx="16" class="fte ste" stroke-width="4"/>
  <rect x="1180" y="440" width="680" height="150" rx="16" class="fco sco" stroke-width="4"/>
  <rect x="1180" y="620" width="680" height="150" rx="16" class="fam sam" stroke-width="4"/>
  <g class="md"><text x="1210" y="320" class="te">1  Own folder per job.</text><text x="1210" y="365">The folder is also its jail.</text>
  <text x="1210" y="500" class="co">2  A crash becomes a result.</text><text x="1210" y="545">Job 3 failing spares the rest.</text>
  <text x="1210" y="680" class="am">3  Sort at the end.</text><text x="1210" y="725">Results finish in any order.</text></g>
  <rect x="460" y="880" width="1000" height="90" rx="16" class="box da"/>
  <text x="960" y="938" class="md c">Nothing clever. That is the lesson.</text>
</svg>
