  <text x="280" y="535" class="sm c">so far…</text>

<!-- 02 -->
<svg class="d" data-t="A brain in a jar" data-s="Tools break the glass. They let the model touch the outside world.">
  <rect x="190" y="235" width="360" height="50" rx="12" class="box"/>
  <rect x="110" y="280" width="520" height="680" rx="60" class="fbl sbl" stroke-width="5"/>
  <use href="#man" x="320" y="520"/>
  <text x="370" y="470" class="bb c vi">MODEL</text>
  <text x="370" y="790" class="sm c">a brain in a jar</text>
  <text x="370" y="900" class="an c co">can THINK — can't TOUCH</text>
  <path d="M630 560 l-34 44 l34 36 l-34 50" class="ln sco" stroke-width="6"/>
  <text x="700" y="900" class="bb am">TOOLS</text>
  <text x="700" y="945" class="sm">= the wheels</text>
  <g class="md">
    <rect x="1130" y="270" width="620" height="90" rx="14" class="box"/><text x="1440" y="327" class="c">GitHub repository</text>
    <rect x="1130" y="390" width="620" height="90" rx="14" class="box"/><text x="1440" y="447" class="c">Your terminal</text>
    <rect x="1130" y="510" width="620" height="90" rx="14" class="box"/><text x="1440" y="567" class="c">Google Drive</text>
    <rect x="1130" y="630" width="620" height="90" rx="14" class="box"/><text x="1440" y="687" class="c">Slack</text>
    <rect x="1130" y="750" width="620" height="90" rx="14" class="box"/><text x="1440" y="807" class="c">Any API (Zoom, Jira, Notion…)</text>
  </g>
  <line x1="660" y1="610" x2="1112" y2="318" class="ln sam" marker-end="url(#a)"/>
  <line x1="660" y1="620" x2="1112" y2="438" class="ln sam" marker-end="url(#a)"/>
  <line x1="660" y1="630" x2="1112" y2="558" class="ln sam" marker-end="url(#a)"/>
  <line x1="660" y1="640" x2="1112" y2="678" class="ln sam" marker-end="url(#a)"/>
  <line x1="660" y1="650" x2="1112" y2="798" class="ln sam" marker-end="url(#a)"/>
  <text x="1130" y="920" class="bb am">The "A" in thought → ACTION → observation</text>
  <text x="1130" y="965" class="sm">that is what tools give the model</text>
</svg>

<!-- 03 -->
<svg class="d" data-t="Two kinds of tools" data-s="Every modern harness has pre-built tools and external tools. How many you ship is a design decision.">
  <rect x="80" y="235" width="820" height="520" rx="20" class="fte ste" stroke-width="4"/>
  <text x="490" y="300" class="bb c te">PRE-BUILT</text>
  <text x="490" y="340" class="sm c">ship inside the harness</text>
  <g class="mono" font-size="32">
    <text x="260" y="410">read    → look at files</text>
    <text x="260" y="460">write   → create files</text>
    <text x="260" y="510">edit    → fix part of a file</text>
    <text x="260" y="560" class="co">bash    → run commands (!)</text>
    <text x="260" y="610">grep    → search inside files</text>
    <text x="260" y="660">ls      → list a folder</text>
    <text x="260" y="710">find    → locate files</text>
  </g>
  <rect x="1020" y="235" width="820" height="520" rx="20" class="fvi svi" stroke-width="4"/>
  <text x="1430" y="300" class="bb c vi">EXTERNAL</text>
  <text x="1430" y="340" class="sm c">added by the user or the project</text>
  <text x="1070" y="420" class="md">• MCP servers — someone already</text>
  <text x="1095" y="458" class="md">wrote the tools (GitHub MCP: 27)</text>
  <text x="1070" y="530" class="md">• Your own Python scripts as tools</text>
  <text x="1070" y="600" class="md">• Plugins: Jira, Notion, Salesforce…</text>
  <text x="1070" y="670" class="md">• Added at design time OR run time</text>
  <rect x="80" y="800" width="1760" height="190" rx="18" class="box da"/>
  <text x="960" y="850" class="bb c">A design question: how many tools do you ship?</text>
  <text x="340" y="910" class="md c bl">Pi</text><text x="340" y="950" class="sm c">few pre-built, plugins for the rest</text>
  <text x="960" y="910" class="md c co">Hermes</text><text x="960" y="950" class="sm c">many pre-built, everything out of the box</text>
  <text x="1580" y="910" class="md c te">Zill</text><text x="1580" y="950" class="sm c">follows Pi: small and minimal</text>
</svg>

<!-- 04 -->
<svg class="d" data-t="A tool has two halves" data-s="The model reads one half. Your code runs the other. It never sees the curtain.">
  <rect x="80" y="240" width="720" height="600" rx="20" class="fvi svi" stroke-width="4"/>
  <text x="440" y="300" class="bb c vi">INTERFACE</text>
  <text x="440" y="338" class="sm c">what the MODEL sees</text>
  <g>
    <text x="130" y="420" class="mono bb am">name</text><text x="330" y="420" class="md">which tool is this?</text>
    <text x="130" y="500" class="mono bb am">label</text><text x="330" y="500" class="md">a tag, to bucket the tool</text>
    <text x="130" y="580" class="mono bb am">description</text><text x="400" y="580" class="md">when to use it</text>
    <text x="400" y="615" class="an co">← the most important line</text>
    <text x="130" y="700" class="mono bb am">parameters</text><text x="400" y="700" class="md">what to fill in</text>
  </g>
  <text x="440" y="790" class="an c vi">a job posting: title · description · form</text>
  <path d="M860 250 q22 55 0 110 t0 110 t0 110 t0 110 t0 110" class="ln sco" stroke-width="7"/>
  <text x="860" y="235" class="an c co">THE CURTAIN</text>
  <rect x="930" y="240" width="910" height="600" rx="20" class="fam sam" stroke-width="4"/>
  <text x="1385" y="300" class="bb c am">IMPLEMENTATION</text>
  <text x="1385" y="338" class="sm c">what RUNS — the model never sees it</text>
  <g class="mono" font-size="34">
    <text x="1030" y="440">execute(</text>
    <text x="1070" y="490">toolCallId,</text>
    <text x="1070" y="540">params,</text>
    <text x="1070" y="590">signal,</text>
    <text x="1070" y="640">onUpdate</text>
    <text x="1030" y="690">)</text>
  </g>
  <text x="1380" y="590" class="an am">← cancel signal</text>
  <text x="1380" y="640" class="an am">← stream progress</text>
  <text x="1030" y="780" class="md">plain code: read the file, run the command</text>
  <text x="960" y="920" class="bb c">The model decides from the words alone.</text>
  <text x="960" y="970" class="b c mu">Then the executor runs the code behind the curtain.</text>
</svg>

<!-- 05 -->
<svg class="d" data-t="What the model actually receives" data-s="This is the read_file contract exactly as the model reads it. It acts on these words, and only these words.">
  <rect x="60" y="235" width="1150" height="560" rx="18" fill="#fff9db" stroke="#1e1e1e" stroke-width="3"/>
  <g class="mono" font-size="30">
    <text x="90" y="300">{"name": "read_file",</text>
    <text x="90" y="350">  "description": "Read a file. Returns its</text>
    <text x="90" y="400" class="te">                 contents with line numbers.",</text>
    <text x="90" y="450">  "parameters": {</text>
    <text x="90" y="500">    "type": "object",</text>
    <text x="90" y="550">    "properties": {</text>
    <text x="90" y="600">      "path": {"type": "string",</text>
    <text x="90" y="650" class="bl">               "description": "Path relative to</text>
    <text x="90" y="700" class="bl">                               the working directory"}},</text>
    <text x="90" y="750" class="co">    "required": ["path"]}}</text>
  </g>
  <line x1="1250" y1="390" x2="1060" y2="395" class="ln ste da" marker-end="url(#a)"/>
  <text x="1270" y="350" class="an te">promises line numbers</text>
  <text x="1270" y="384" class="an te">→ the model can cite</text>
  <text x="1270" y="418" class="an te">a location next call</text>
  <line x1="1250" y1="670" x2="1180" y2="672" class="ln sbl da" marker-end="url(#a)"/>
  <text x="1270" y="630" class="an bl">relative path</text>
  <text x="1270" y="664" class="an bl">→ no guessing at</text>
  <text x="1270" y="698" class="an bl">absolute paths</text>
  <line x1="1250" y1="750" x2="790" y2="748" class="ln sco da" marker-end="url(#a)"/>
  <text x="1270" y="790" class="an co">required = may never be</text>
  <text x="1270" y="824" class="an co">omitted. Enforced when</text>
  <text x="1270" y="858" class="an co">the call is generated.</text>
  <text x="960" y="900" class="bb c am">The schema isn't a suggestion. It's a fence the model can't climb.</text>
  <text x="960" y="960" class="sm c">And it is re-sent on EVERY turn — a long description is rent you pay forever.</text>
</svg>

<!-- 06 -->
<svg class="d" data-t="A loose form and a tight one" data-s="Same edit function, two contracts. Only one of them teaches the model what to do.">
  <rect x="80" y="235" width="830" height="580" rx="20" class="fco sco" stroke-width="4"/>
  <text x="495" y="300" class="bb c co">LOOSE</text>
  <g class="mono" font-size="27">
    <text x="120" y="370">name: edit_file</text>
    <text x="120" y="415">description: "Edit a file."</text>
    <text x="120" y="460">parameters:</text>
    <text x="120" y="505">  args: string       ← ???</text>
  </g>
  <text x="120" y="590" class="md">• the model must INVENT a format</text>
  <text x="145" y="628" class="sm">JSON? a diff? a shell one-liner?</text>
  <text x="120" y="690" class="md">• nothing is required → a blank</text>
  <text x="145" y="728" class="sm">may simply be missing</text>
  <text x="120" y="780" class="md co">registers fine — fails quietly, forever</text>
  <rect x="1010" y="235" width="830" height="580" rx="20" class="fte ste" stroke-width="4"/>
  <text x="1425" y="300" class="bb c te">TIGHT</text>
  <g class="mono" font-size="27">
    <text x="1050" y="370">name: edit_file</text>
    <text x="1050" y="415">description: "Replace an exact text</text>
    <text x="1050" y="450">  snippet. It must appear once."</text>
    <text x="1050" y="500">parameters (all required):</text>
    <text x="1050" y="545">  path  relative to working dir</text>
    <text x="1050" y="585">  old   exact text, must be unique</text>
    <text x="1050" y="625">  new   replacement text</text>
  </g>
  <text x="1050" y="700" class="md">• fill-in-the-blanks: hard to get wrong</text>
  <text x="1050" y="750" class="md">• the description already teaches</text>
  <text x="1075" y="788" class="md">the uniqueness rule</text>
  <rect x="300" y="860" width="1320" height="130" rx="18" class="box da"/>
  <text x="960" y="915" class="bb c">Require ONLY what the function cannot proceed without.</text>
  <text x="960" y="962" class="sm c">Over-required → the model invents values just to fill the blanks.</text>
</svg>

<!-- 07 -->
<svg class="d" data-t="Six hands cover the verbs" data-s="Inspect, create, correct, execute, navigate, search. Nearly every gadget people ask for is one of these in a costume.">
  <g>
    <rect x="100" y="235" width="520" height="250" rx="18" class="fbl sbl" stroke-width="4"/>
    <text x="360" y="295" class="an c bl">INSPECT</text><text x="360" y="355" class="mono bb c">read_file</text><text x="360" y="410" class="md c">contents, with line numbers</text>
    <rect x="700" y="235" width="520" height="250" rx="18" class="fte ste" stroke-width="4"/>
    <text x="960" y="295" class="an c te">CREATE</text><text x="960" y="355" class="mono bb c">write_file</text><text x="960" y="410" class="md c">a new file (makes the folders)</text>
    <rect x="1300" y="235" width="520" height="250" rx="18" class="fvi svi" stroke-width="4"/>
    <text x="1560" y="295" class="an c vi">CORRECT</text><text x="1560" y="355" class="mono bb c">edit_file</text><text x="1560" y="410" class="md c">replace one unique snippet</text>
    <rect x="100" y="545" width="520" height="250" rx="18" class="fco sco" stroke-width="5"/>
    <text x="360" y="605" class="an c co">EXECUTE</text><text x="360" y="665" class="mono bb c">bash</text><text x="360" y="720" class="md c co">runs ANYTHING — the stove</text>
    <rect x="700" y="545" width="520" height="250" rx="18" class="fam sam" stroke-width="4"/>
    <text x="960" y="605" class="an c am">NAVIGATE</text><text x="960" y="665" class="mono bb c">list_files</text><text x="960" y="720" class="md c">what is in this folder?</text>
    <rect x="1300" y="545" width="520" height="250" rx="18" class="fam sam" stroke-width="4"/>
    <text x="1560" y="605" class="an c am">SEARCH</text><text x="1560" y="665" class="mono bb c">grep</text><text x="1560" y="720" class="md c">which file has this text?</text>
  </g>
  <rect x="100" y="850" width="1720" height="150" rx="18" class="box da"/>
  <text x="960" y="905" class="b c">Every extra tool grows the decision surface the model must think over on EVERY turn.</text>
  <text x="960" y="950" class="b c">Overlapping tools make it waste a turn choosing instead of acting.</text>
  <text x="960" y="985" class="an c mu">(Pi also ships find — Zill skips it to stay small)</text>
</svg>

<!-- 08 -->
<svg class="d" data-t="Two axes of tool design" data-s="Every design decision either helps the next step or protects the conversation.">
  <rect x="80" y="235" width="830" height="480" rx="20" class="fte ste" stroke-width="4"/>
  <text x="495" y="295" class="bb c te">TWO AXES</text>
