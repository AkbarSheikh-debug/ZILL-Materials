<script>
const NS='http://www.w3.org/2000/svg';

if(pro) document.body.classList.add('pro');
const all=[...document.querySelectorAll('svg.d')];
const ORDER=Array.from({length:64},(_,i)=>i+1);

const slides=ORDER.map(k=>all[k-1]);
slides.forEach(s=>document.body.insertBefore(s,document.currentScript));
slides.forEach((svg,i)=>{
  const n=i+1, nn=String(n).padStart(2,'0');
  if(only && +only!==n){svg.remove();return;}
  svg.setAttribute('viewBox','0 0 1920 1080');

  let head=`<defs>

  </defs>
  <defs>
    <filter id="wob${n}" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="2" seed="${n*7}" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <g id="man${n}" fill="none" stroke="#1e1e1e" stroke-width="4" stroke-linecap="round">
      <circle cx="50" cy="28" r="24" fill="#ffffff"/>
      <path d="M41 23v5M59 23v5M40 37q10 9 20 0"/>
      <path d="M50 52V125M50 78L12 108M50 78L90 100M50 125L22 196M50 125L80 196"/>
    </g>
  </defs>
  <rect width="1920" height="1080" fill="#fffdf7"/>
  <g filter="url(#wob${n})">
  <text x="960" y="108" class="h c">${svg.dataset.t}</text>
  <path class="ul" d=""/>
  <text x="960" y="182" class="sub c">${svg.dataset.s}</text>
  <text x="70" y="1048" class="ft">ZILL HARNESS · Lecture 4 · Context</text>
  <text x="1850" y="1048" class="ft" text-anchor="end">${nn}</text>`;
  if(pro) head=head.split('<rect width="1920"')[0]+`<pattern id="dots${n}" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#d5dde7"/></pattern>
  <rect width="1920" height="1080" fill="#f8fafc"/><rect width="1920" height="1080" fill="url(#dots${n})"/>
  <g>
  <path class="ul" d="M78 66V186"/>
  <text x="104" y="84" class="kick">ZILL HARNESS · Lecture 4 · Context</text>
  <text x="104" y="142" class="h">${svg.dataset.t}</text>
  <text x="104" y="186" class="sub">${svg.dataset.s}</text>
  <text x="1850" y="1048" class="ft" text-anchor="end">${nn} / ${slides.length}</text>`;
  svg.innerHTML=head+svg.innerHTML.replaceAll('url(#a)',`url(#a${n})`).replaceAll('url(#b)',`url(#b${n})`).replaceAll('#man',`#man${n}`)+'</g>';
  if(!pro){
    const L=Math.min(svg.querySelector('.h').getComputedTextLength(),1750);
    svg.querySelector('.ul').setAttribute('d',`M${960-L/2} 130 q${L/4} 12 ${L/2} 0 t${L/2} 0`);
  }
});
if(only) document.body.classList.add('single');
</script>
